<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How Hermes EGM works</title>
  <desc id="desc">First, draft with your context-rich main agent. Second, choose a design and relevant source excerpts. Third, one to three separate tool-free model requests review that snapshot. Fourth, the plugin checks quoted evidence and returns findings for you to judge. Chat and memory are not automatically attached. No automatic edits or approval.</desc>
  <!-- Original repository diagram. Apache-2.0; see ../LICENSE. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5DEC9" stroke-width=".5" opacity=".06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#FFDE1A"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#0B0C0E"/>
  <rect width="1200" height="650" fill="url(#grid)"/>
  <g font-family="DejaVu Sans,sans-serif">
    <text x="44" y="59" fill="#E5DEC9" font-size="34" font-weight="700">From a design draft to a second opinion.</text>
    <text x="44" y="96" fill="#A9ADA5" font-size="21">Keep the project context with the author. Give reviewers a smaller, explicit snapshot.</text>
    <g fill="none" stroke="#FFDE1A" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M300 292h37M582 292h37M894 292h37"/>
    </g>
    <rect x="44" y="139" width="256" height="311" fill="#15181C" stroke="#62675D"/>
    <text x="65" y="174" fill="#A9ADA5" font-family="DejaVu Sans Mono,monospace" font-size="17">01 / MAIN AGENT</text>
    <text x="65" y="218" fill="#E5DEC9" font-size="24" font-weight="700">Design together</text>
    <text x="65" y="263" fill="#C9CBBB" font-size="21">Requirements</text>
    <text x="65" y="296" fill="#C9CBBB" font-size="21">Relevant code</text>
    <text x="65" y="329" fill="#C9CBBB" font-size="21">Trade-offs</text>
    <path d="M65 357h213" stroke="#62675D"/>
    <text x="65" y="393" fill="#FFDE1A" font-size="19">The elephant keeps</text>
    <text x="65" y="420" fill="#FFDE1A" font-size="19">the project context.</text>
    <rect x="350" y="139" width="232" height="311" fill="#E5DEC9"/>
    <text x="371" y="174" fill="#4D524A" font-family="DejaVu Sans Mono,monospace" font-size="17">02 / SNAPSHOT</text>
    <text x="371" y="218" fill="#0B0C0E" font-size="24" font-weight="700">Pick the text</text>
    <text x="371" y="263" fill="#333A36" font-size="21">Your design</text>
    <text x="371" y="296" fill="#333A36" font-size="21">+ source excerpts</text>
    <path d="M371 333h190M371 346h190M371 359h130" stroke="#6C7264" stroke-width="2"/>
    <text x="371" y="398" fill="#103CE7" font-size="19" font-weight="700">This is what the</text>
    <text x="371" y="425" fill="#103CE7" font-size="19" font-weight="700">reviewers receive.</text>
    <rect x="632" y="139" width="262" height="311" fill="#101B36" stroke="#3159F2"/>
    <text x="653" y="174" fill="#9AB0FF" font-family="DejaVu Sans Mono,monospace" font-size="17">03 / FRESH CALLS</text>
    <text x="653" y="218" fill="#E5DEC9" font-size="24" font-weight="700">Review the draft</text>
    <g fill="#E5DEC9" font-size="21">
      <text x="653" y="270">Comprehension</text>
      <text x="653" y="310">Design</text>
      <text x="653" y="350">Readiness</text>
    </g>
    <path d="M653 282h219M653 322h219M653 362h219" stroke="#3159F2"/>
    <text x="653" y="400" fill="#9AB0FF" font-size="19">1–3 tool-free calls.</text>
    <text x="653" y="427" fill="#9AB0FF" font-size="19">One call per lens.</text>
    <rect x="944" y="139" width="212" height="311" fill="#15181C" stroke="#62675D"/>
    <text x="965" y="174" fill="#A9ADA5" font-family="DejaVu Sans Mono,monospace" font-size="17">04 / FINDINGS</text>
    <text x="965" y="218" fill="#FFDE1A" font-size="24" font-weight="700">You decide</text>
    <text x="965" y="263" fill="#C9CBBB" font-size="19">Quotes checked</text>
    <text x="965" y="292" fill="#C9CBBB" font-size="19">against the text.</text>
    <path d="M965 316h170" stroke="#62675D"/>
    <text x="965" y="351" fill="#C9CBBB" font-size="21">Accept, revise,</text>
    <text x="965" y="381" fill="#C9CBBB" font-size="21">or reject advice.</text>
    <text x="965" y="426" fill="#FFDE1A" font-size="18">Not a certificate.</text>
    <path d="M44 486H1156" stroke="#62675D"/>
    <text x="44" y="523" fill="#E5DEC9" font-size="21" font-weight="700">No hidden conversation handoff.</text>
    <text x="44" y="557" fill="#A9ADA5" font-size="20">Earlier chat and memory are not attached.</text>
    <text x="44" y="587" fill="#A9ADA5" font-size="20">Select text carefully. There is no secret redaction.</text>
    <text x="632" y="523" fill="#E5DEC9" font-size="21" font-weight="700">A checked quote is not checked reasoning.</text>
    <text x="632" y="557" fill="#A9ADA5" font-size="20">Reviewers can miss problems or be wrong.</text>
    <text x="632" y="587" fill="#A9ADA5" font-size="20">No automatic edits. No automatic approval.</text>
  </g>
</svg>
